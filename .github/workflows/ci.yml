name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Test (race detector)
        run: go test ./... -race -count=1

      - name: No-TUI restore guard
        run: make notui-noexit-check

      - name: Binary size check
        run: make size-check

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true

      # Pinned so a scanner release cannot change the verdict on an unrelated
      # PR. The advisory database is still queried live — that is the point.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      # Policy: fail on findings outside the standard library; report stdlib
      # findings as a job-summary warning without failing. A stdlib advisory is
      # fixed by bumping the toolchain, which this workflow controls — failing
      # the build of whoever happens to open the next PR is noise, and noise is
      # what gets a gate switched off. Rationale is recorded in CONTRIBUTING.md.
      - name: Scan
        run: |
          set -euo pipefail
          # Exits 3 when it finds something reachable; the verdict is ours to make.
          govulncheck -json ./... > vulns.json || true

          # A finding whose first trace frame names a function is one the build
          # actually reaches. A module-only frame means "present, never called".
          # -json is parsed rather than the text output, which is not a contract.
          jq -r 'select(has("finding")) | .finding
                 | select(.trace[0].function != null)
                 | [.trace[0].module, .osv] | @tsv' vulns.json | sort -u > called.tsv

          external=$(grep -cv '^stdlib' called.tsv || true)
          stdlib=$(grep -c '^stdlib' called.tsv || true)

          if [ "$stdlib" -gt 0 ]; then
            {
              echo "### govulncheck: $stdlib standard-library advisory/advisories"
              echo
              echo "Not failing the build — these are fixed by a toolchain bump."
              echo "If this list is non-empty, bump \`go-version\` deliberately."
              echo
              echo '```'
              grep '^stdlib' called.tsv
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$external" -gt 0 ]; then
            echo "::error::govulncheck found reachable vulnerabilities outside the standard library"
            grep -v '^stdlib' called.tsv
            exit 1
          fi
          echo "No reachable non-stdlib vulnerabilities."

  installer:
    name: install.sh & release config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ubuntu-latest ships shellcheck; pin nothing extra. Zero warnings is
      # a hard gate — the installer is piped to users' shells.
      - name: ShellCheck install.sh
        run: shellcheck install.sh scripts/test-install-sh.sh

      # Offline harness: localhost stand-in for the GitHub API + downloads.
      - name: install.sh regression harness
        run: ./scripts/test-install-sh.sh

      # Catches .goreleaser.yaml schema drift before a tag ever triggers a
      # real publish (no network/build — config validation only).
      - name: GoReleaser config check
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "v2.15.4"
          args: check
