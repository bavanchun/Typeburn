version: 2

# Nothing in this repo tracked dependency freshness, so every update was manual
# and therefore did not happen. Weekly, grouped, so the noise stays reviewable:
# a maintainer sees one PR per ecosystem rather than one per module.
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Direct and indirect move together — an indirect bump that breaks the
      # build should fail in the same PR that caused it.
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
